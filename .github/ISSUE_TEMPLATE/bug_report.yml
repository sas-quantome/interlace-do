name: CLI Bug Report
description: File a bug report for this CLI tool.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please ensure you are using the latest version of the CLI before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command Executed
      description: The exact command and flags you ran in your terminal.
      placeholder: "e.g., a32004 -silent -inp-path pubmed_reference/20260906180032 -query-terms sdk_entrez_gene_id_u.bin/eq/2309"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Output
      description: What actually happened? Please paste any error messages, panics, or terminal logs.
      value: |
        ```text
        Paste terminal output here...
        ```
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CLI Version
      description: What version of the tool are you using? (Provide the application version or the GitHub release version)
      placeholder: "e.g., 2026_10_25_12 or v1.0.0-rc.1"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation Method
      description: How did you install the CLI?
      options:
        - Downloaded pre-compiled binary (from GitHub Releases)
        - Built from source (`go install` or `go build`)
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true