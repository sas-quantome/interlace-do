name: Release and Build

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------
  # JOB 1: Calculate versions and generate changelog
  # ---------------------------------------------------------
  release-please:
    runs-on: ubuntu-latest
    # We must expose these outputs so Job 2 knows what happened
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ---------------------------------------------------------
  # JOB 2: Compile binaries and attach them
  # ---------------------------------------------------------
  build-and-attach:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Compile All Binaries (Cross-Compile)
        run: |
          for cmd in $(ls ./cmd); do
            for os in linux darwin; do
              for arch in amd64 arm64; do
                echo "Building $cmd for $os/$arch..."
                GOOS=$os GOARCH=$arch go build -o ${cmd}-${os}-${arch} ./cmd/${cmd}
              done
            done
          done

      - name: Attach Assets and Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          draft: false
          files: |
            *-linux-*
            *-darwin-*